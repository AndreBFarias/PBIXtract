[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pbix-mapper"
version = "0.1.0"
description = "Extract and map all data sources from Power BI (.pbix) files"
readme = "docs/README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    { name = "Andre Farias" },
]
keywords = ["power-bi", "pbix", "data-sources", "mapping", "etl", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business",
]
dependencies = [
    "pbixray>=0.5.0",
    "pandas>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
pbix-mapper = "pbix_mapper.cli:app"

[project.urls]
Repository = "https://github.com/andrefarias/pbix-mapper"
Issues = "https://github.com/andrefarias/pbix-mapper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pbix_mapper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
